{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🌸 Login - Radha Naam Jap</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, serif;
            color: white;

            background-image:
                linear-gradient(
                    rgba(20, 5, 30, 0.55),
                    rgba(35, 5, 45, 0.75)
                ),
                url("{% static 'images/backgrounds/home.jpg' %}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 45px;
            border-radius: 30px;

            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.28);

            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);

            text-align: center;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .subtitle {
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 14px 15px;

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;

            background: rgba(255, 255, 255, 0.14);
            color: white;

            outline: none;
            font-size: 15px;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        input:focus {
            border-color: white;
            background: rgba(255, 255, 255, 0.20);
        }

        .btn {
            width: 100%;
            padding: 15px;

            margin-top: 5px;

            border: none;
            border-radius: 30px;

            background: white;
            color: #70245f;

            font-family: Georgia, serif;
            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        }

        .message {
            margin-bottom: 18px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
        }

        .register-link {
            margin-top: 22px;
            font-size: 15px;
        }

        .register-link a,
        .home-link {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover,
        .home-link:hover {
            text-decoration: underline;
        }

        .home-link {
            display: inline-block;
            margin-top: 18px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .login-card {
                padding: 35px 22px;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="icon">
        🌸 🪷 🌸
    </div>

    <h1>राधे राधे</h1>

    <p class="subtitle">
        🙏 Welcome back to Radha Naam Jap
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label>👤 Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
            >
        </div>

        <div class="form-group">
            <label>🔐 Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >
        </div>

        <button type="submit" class="btn">
            📿 Login
        </button>

    </form>

    <div class="register-link">
        Don't have an account?
        <a href="{% url 'register' %}">Register here</a>
    </div>

    <a href="{% url 'home' %}" class="home-link">
        ← Back to Home
    </a>

</div>

</body>
</html>
